services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klasik
      POSTGRES_USER: klasik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klasik-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klasik -d klasik"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost"
      DB_ENGINE: postgres
      DB_NAME: klasik
      DB_USER: klasik
      DB_PASSWORD: ${POSTGRES_PASSWORD:-klasik-local}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
    environment:
      VITE_API_URL: /api
      VITE_SOURCE_DONNEES: api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  backend_media:
