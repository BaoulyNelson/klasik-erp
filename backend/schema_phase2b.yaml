          type: string
        required: true
      - in: query
        name: nature
        schema:
          type: string
          enum:
          - MATIERE
          - MODULE_PRATIQUE
          - MODULE_THEORIQUE
          - UE
        description: |-
          * `MODULE_PRATIQUE` - Module pratique
          * `MODULE_THEORIQUE` - Module théorique
          * `MATIERE` - Matière
          * `UE` - Unité d’enseignement
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
