          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total_paye_htg:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        statut_paiement:
          $ref: '#/components/schemas/StatutPaiementEnum'
