          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        taux_assiduite:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        credits_acquis:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        credits_requis:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        pourcentage_bourse:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        nationalite:
          type: string
          maxLength: 100
        mobilite_internationale:
          type: boolean
        reference_visa_passeport:
          type: string
          maxLength: 100
        tuteurs:
