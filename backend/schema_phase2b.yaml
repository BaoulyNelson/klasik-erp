          type: string
          maxLength: 64
        courriel:
          type: string
          format: email
          maxLength: 191
        adresse:
          type: string
          maxLength: 255
        id_unite:
          type: string
          readOnly: true
        libelle_niveau:
          type: string
          maxLength: 191
        date_inscription:
          type: string
          maxLength: 32
        indice_etape:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        statut:
          $ref: '#/components/schemas/ApprenantStatutEnum'
