openapi: 3.0.3
info:
  title: API Klasik ERP
  version: 1.0.0
  description: API REST de gestion éducative multi-établissements.
paths:
  /api/auth/demo/:
    post:
      operationId: obtenirSessionDemonstration
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilUtilisateur'
          description: ''
  /api/auth/token/:
    post:
      operationId: api_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/blacklist/:
    post:
      operationId: api_auth_token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: api_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/etablissements/:
    get:
      operationId: listerEtablissementsAccessibles
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtablissementAccessible'
          description: ''
  /api/etablissements/{id_etablissement}/:
    patch:
      operationId: modifierConfigurationEtablissement
      parameters:
      - in: path
        name: id_etablissement
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/etablissements/{id_etablissement}/apprenants/:
    get:
      operationId: api_etablissements_apprenants_list
      parameters:
      - in: path
        name: id_etablissement
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - ACTIF
          - DIPLOME
          - EN_STAGE
          - REDOUBLANT
          - SUSPENDU
        description: |-
          * `ACTIF` - Actif
          * `EN_STAGE` - En stage
          * `DIPLOME` - Diplômé
          * `SUSPENDU` - Suspendu
          * `REDOUBLANT` - Redoublant
      - in: query
        name: statut_paiement
        schema:
          type: string
          enum:
          - A_JOUR
          - EN_RETARD
          - PARTIEL
        description: |-
          * `A_JOUR` - À jour
          * `PARTIEL` - Partiel
          * `EN_RETARD` - En retard
      - in: query
        name: unite
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprenantList'
          description: ''
    post:
      operationId: api_etablissements_apprenants_create
      parameters:
      - in: path
        name: id_etablissement
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Apprenant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Apprenant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Apprenant'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apprenant'
          description: ''
  /api/etablissements/{id_etablissement}/apprenants/{id}/:
    get:
      operationId: api_etablissements_apprenants_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: id_etablissement
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apprenant'
          description: ''
    put:
      operationId: api_etablissements_apprenants_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: id_etablissement
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
